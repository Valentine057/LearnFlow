{% extends 'base.html' %}{% block title %}Create account{% endblock %}{% block content %}<section class="auth-page"><div><p class="eyebrow">Start your next chapter</p><h1>Make learning<br><em>a habit.</em></h1></div><form class="auth-form" method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}<p><label for="role">I am joining as</label><select id="role" name="role"><option value="student">Student</option><option value="instructor">Instructor</option></select></p><p><label for="expertise">Expertise <small>(instructor optional)</small></label><input id="expertise" name="expertise" placeholder="e.g. Product design, accounting"></p><p><label for="bio">Short bio <small>(instructor optional)</small></label><textarea id="bio" name="bio" rows="3"></textarea></p><p><label for="photo">Profile photo <small>(instructor optional)</small></label><input id="photo" type="file" name="photo" accept="image/*"></p><button class="button button-dark" type="submit">Create account →</button><p>Already learning? <a href="{% url 'login' %}">Log in</a></p></form></section>{% endblock %}
