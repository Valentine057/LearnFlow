{% extends 'base.html' %}
{% block title %}Delete {{ book.title }}{% endblock %}
{% block content %}
<section class="book-form-page">
  <p class="eyebrow">Course library</p>
  <h1>Delete this book?</h1>
  <p>“{{ book.title }}” will be removed from {{ book.course.title }} and its uploaded file will be deleted.</p>
  <form method="post" class="book-form-actions">
    {% csrf_token %}
    <button class="button button-dark" type="submit">Delete book</button>
    <a class="text-link" href="{% url 'book_library' %}">Cancel</a>
  </form>
</section>
{% endblock %}
