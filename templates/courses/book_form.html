{% extends 'base.html' %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<section class="book-form-page">
  <p class="eyebrow">Course library</p>
  <h1>{{ heading }}</h1>
  <form class="book-form" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="book-form-actions">
      <button class="button button-dark" type="submit">Save book →</button>
      <a class="text-link" href="{% url 'book_library' %}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
